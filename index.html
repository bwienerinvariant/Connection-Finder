<script>
const DB = JSON.parse(document.getElementById('data').textContent);
const TOP = 6;
const state = {org:null, all:false};

/* ---------- scoring: keep strong (4+) and good (3) connections only ---------- */
function hopScore(t){
  t = t || '';
  if (/report|manag/i.test(t)) return /past role/i.test(t) ? 4 : 5;
  if (/serves on same board/i.test(t)) return 4;
  if (/career history|works together|worked|employ/i.test(t)) return 3;
  return 1;
}
function scoreRow(r){
  const d = r.d;
  if (r.type === 'mutual') return (d && typeof d === 'object' && !d.err) ? Math.max(0, Math.min(hopScore(d.d1), hopScore(d.d2)) - 1) : 0;
  const t = String(d || '');
  let s = r.type==='reporting' ? 5 : r.type==='board' ? 4 : r.type==='career' ? 3 : 1;
  if (/managed|reported to/i.test(t)) s = Math.max(s, /past role/i.test(t) ? 4 : 5);
  return s;
}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function noBrackets(s){ return String(s||'').replace(/\s*\[[^\]]*\]/g,'').replace(/\s*\((?:[RDI]-)?[A-Z]{2}(?:,\s*(?:District\s*)?\d+)?\)/g,'').replace(/,\s*(House of Representatives Leadership|Senate Leadership|Congressional and Staff Organizations|House Member Organizations|United States Congress)\s*$/,'').trim().replace(/,?\s+(Inc\.?|Incorporated|Corporation|Corp\.?|LLC|L\.L\.C\.|L\.P\.|LP|plc|Ltd\.?|Limited)$/i,'').replace(/,?\s+(Inc\.?|Corporation|Corp\.?|LLC)$/i,'').trim(); }
function shortName(n){
  n = String(n||'').replace(/\s*\((?:[RDI]-[^)]*|[RDI])\)/g,'').split(',')[0];
  const nick = n.match(/"([^"]+)"/);
  if (nick){ const last = n.replace(/"[^"]*"/,' ').trim().split(/\s+/).pop(); return nick[1] + ' ' + last; }
  return n.replace(/\([^)]*\)/g,' ').replace(/\b[A-Z]\.\s/g,'').replace(/\s+/g,' ').trim();
}
const first = n => shortName(n).split(' ')[0];
function initials(n){ const p = shortName(n).split(' ').filter(Boolean); return ((p[0]||'')[0]||'') + ((p.length>1?p[p.length-1]:'')[0]||''); }
function shortRole(c){
  const board = /^board of directors/i.test(noBrackets(c[2]));
  const t = noBrackets(c[1]);
  if (board) return (!t || /^director$/i.test(t)) ? 'Board member' : t;
  return t || noBrackets(c[2]);
}
function years(s){                       // "(08/2013 – 07/2014), (09/2021 – 01/20/2025)" -> "2013–2014"
  const g = String(s||'').match(/\(([^)]*)\)/); if (!g) return '';
  const y = g[1].match(/\d{4}/g) || []; if (!y.length) return '';
  const a = y[0], b = y[y.length-1];
  return a === b ? a : a + '–' + b;
}
function lastYear(s){ const m = String(s||'').match(/\((?:[^)]*?)(\d{4})[^)]*\)/); return m ? +m[1] : 0; }
function midParts(d){
  const raw = (d && d.mid && d.mid[0]) || '';
  const rest = (d && d.mid && d.mid[1]) || '';
  const all = rest ? raw + ', ' + rest : raw;
  const seg = all.split(', ').map(s => s.trim()).filter(Boolean);
  const org = seg.length > 1 ? noBrackets(seg[seg.length-1]) : '';
  return {name: shortName(raw.split(', ')[0] || raw), org};
}


/* ---------- card lines: one per kind of tie, Invariant names in bold ---------- */
function span(list){ const n = list.flatMap(s => String(s||'').match(/\d{4}/g) || []).map(Number); if(!n.length) return ''; const a=Math.min.apply(null,n), b=Math.max.apply(null,n); return a===b ? ''+a : a+'–'+b; }
function nameList(a, cap){ const b = a.slice(0, cap||4).map(n => '<b>' + esc(n) + '</b>');
  if (a.length > b.length) return b.join(', ') + ' and others';
  return b.length>1 ? b.slice(0,-1).join(', ') + ' and ' + b[b.length-1] : b[0]; }
function lines(g){
  const cn = first(g.contact[0]), buckets = new Map();
  g.paths.forEach(p => {
    const d = String(p.d||''); let key, kind, org = '', yrs = '', verb = '';
    const r = d.match(/^(.+?) (managed|reported to) (.+?) in a past role/);
    if (r){ kind='rep'; verb=r[2]; const parts = d.split(' | ').map(s=>s.trim()).filter(Boolean);
      org = parts[2] && !/^\(/.test(parts[2]) ? noBrackets(parts[2]).replace(/,\s*$/,'') : ''; yrs = parts[3]||''; }
    else if (/^(Serves on Same Board|Works together at)/.test(d)){ kind='board'; const parts = d.split(' | ').map(x=>x.trim().replace(/,$/,'')).filter(Boolean).slice(1).filter(x=>!/^Board of (Directors|Trustees|Overseers)$/i.test(x)); org = noBrackets((parts[0]||'').split(', ')[0]); }
    else { const c = d.match(/^Career:\s*(.*?)\s*\|\s*(.*)$/);
      if (c){ org = noBrackets(c[1]); yrs = c[2]; kind = /invariant/i.test(org) ? 'inv' : 'emp'; } else kind='other'; }
    key = kind + '|' + verb + '|' + org;
    if (!buckets.has(key)) buckets.set(key, {kind, verb, org, people:[], yrs:[], score:p.score});
    const b = buckets.get(key); const sn = shortName(p.person[0]).split(' '); const nm = sn.length>2 ? sn[0]+' '+sn[sn.length-1] : sn.join(' '); if (!b.people.includes(nm)) b.people.push(nm); b.yrs.push(yrs);
  });
  const arr = [...buckets.values()].sort((a,b)=> b.score-a.score);
  const items = arr.map(b => {
    const y = span(b.yrs), when = y ? ' (' + y + ')' : '';
    if (b.kind==='rep') return {cls:'k-rep', html: nameList(b.people) + ' ' + b.verb + ' <b class="c">' + esc(cn) + '</b>' + (b.org ? ' at ' + esc(b.org) : '') + when};
    if (b.kind==='inv') return {cls:'k-inv', html: '<b class="c">' + esc(cn) + '</b> worked at Invariant' + when + '. Overlapped with ' + nameList(b.people, 3)};
    if (b.kind==='board') return {cls:'k-emp', html: nameList(b.people) + ' and <b class="c">' + esc(cn) + '</b> both serve on the board of <b>' + esc(b.org) + '</b>'};
    if (b.kind==='emp') return {cls:'k-emp', html: nameList(b.people) + ' overlapped with <b class="c">' + esc(cn) + '</b> at ' + esc(b.org) + when};
    return {cls:'k-emp', html: nameList(b.people) + ' · connected to <b class="c">' + esc(cn) + '</b>'};
  });
  const top = arr[0].kind;
  return {cls: top==='rep' ? 't-g' : top==='inv' ? 't-b' : 't-p', items};
}

/* ---------- one card per company contact ---------- */
function story(g){
  const top = g.paths[0], d = top.d, cn = first(g.contact[0]);
  const people = [...new Set(g.paths.map(p => shortName(p.person[0])))];
  if (top.type === 'mutual'){
    const m = midParts(d);
    return {cls:'t-o', tag:'Through a mutual contact', people,
      text: esc(first(top.person[0])) + ' knows <b>' + esc(m.name) + '</b>' + (m.org ? ' (' + esc(m.org) + ')' : '') + ', who knows ' + esc(cn) + '.'};
  }
  const t = String(d||'');
  const r = t.match(/^(.+?) (managed|reported to) (.+?) in a past role/);
  if (r){
    const parts = t.split(' | ').map(s => s.trim()).filter(Boolean);
    const where = parts[2] && !/^\(/.test(parts[2]) ? noBrackets(parts[2]).replace(/,\s*$/,'') : '';
    const yrs = years(parts[3] || '');
    return {cls:'t-g', tag:'Past reporting line', people,
      text: esc(first(r[1])) + ' ' + r[2] + ' ' + esc(first(r[3])) + (where ? ' at <b>' + esc(where) + '</b>' + (yrs ? ', ' + yrs : '') : ' in a past role') + '.'};
  }
  const c = t.match(/^Career:\s*(.*?)\s*\|\s*(.*)$/);
  if (c){
    const org = noBrackets(c[1]);
    const same = g.paths.filter(p => p.type==='career' && String(p.d).indexOf(c[1]) > -1);
    const who = [...new Set(same.map(p => shortName(p.person[0])))];
    if (/invariant/i.test(org)){
      const ys = same.map(p => String(p.d).split('|')[1]||'').join(' ').match(/\d{4}/g) || [];
      const a = Math.min.apply(null, ys), b = Math.max.apply(null, ys);
      return {cls:'t-b', tag:'Former Invariant employee', people: who, askLabel:'Invariant colleagues who overlapped',
        text: esc(cn) + ' <b>worked at Invariant</b>' + (ys.length ? ' from ' + a + ' to ' + b : '') + '.'};
    }
    const yrs = years(c[2]);
    const when = yrs ? ' (' + yrs + ')' : '';
    return {cls:'t-p', tag:'Shared past employer', people: who, askLabel: who.length>1 ? 'Invariant colleagues' : 'Invariant colleague',
      text: who.length===1
        ? '<b>' + esc(who[0]) + '</b> and <b>' + esc(cn) + '</b> both worked at <b>' + esc(org) + '</b>' + when + '.'
        : '<b>' + esc(cn) + '</b> worked at <b>' + esc(org) + '</b>' + when + ', at the same time as the Invariant colleagues below.'};
  }
  return {cls:'t-p', tag:'Direct connection', people, text: ''};
}

/* ---------- data ---------- */
const ORGS = DB.orgs.map(o => ({
  id:o.id, name:noBrackets(o.name), cat:o.cat, rating:o.strength, extra:(o.N||[]), C:o.C,
  paths:o.R.map(r => { const p = {person:o.P[r[0]], contact:o.C[r[1]], type:r[2], d:r[3], rank:r[4]}; p.score = scoreRow(p); return p; })
}));
const BIG = 3;   // same person matching this many contacts via one old employer = too generic to list
function sharedOrg(p){ const m = p.type==='career' && String(p.d).match(/^Career:\s*(.*?)\s*\|/); return m && !/invariant/i.test(m[1]) ? noBrackets(m[1]) : null; }
function analyze(o){
  const good = o.paths.filter(p => p.score >= 3), cnt = new Map();
  good.forEach(p => { const g = sharedOrg(p); if (!g) return; const k = p.person[0] + '||' + g;
    if (!cnt.has(k)) cnt.set(k, new Set()); cnt.get(k).add(p.contact[0]); });
  const generic = k => cnt.has(k) && cnt.get(k).size >= BIG;
  const notes = [], seen = new Set();
  good.forEach(p => { const g = sharedOrg(p); if (!g) return; const k = p.person[0] + '||' + g;
    if (generic(k) && !seen.has(k)){ seen.add(k);
      const ys = good.filter(q => q.person[0]===p.person[0] && sharedOrg(q)===g).map(q => years(String(q.d).split('|').slice(1).join('|')));
      notes.push({person:shortName(p.person[0]), org:g, yrs: ys.every(y => y===ys[0]) ? ys[0] : ''}); } });
  const map = new Map();
  good.forEach(p => { const g = sharedOrg(p); if (g && generic(p.person[0] + '||' + g)) return;
    const k = p.contact[0]; if (!map.has(k)) map.set(k, {contact:p.contact, paths:[]}); map.get(k).paths.push(p); });
  const arr = [...map.values()];
  arr.forEach(g => g.paths.sort((a,b)=>b.score-a.score||a.rank-b.rank));
  arr.sort((a,b)=>b.paths[0].score-a.paths[0].score||b.paths.length-a.paths.length||a.contact[0].localeCompare(b.contact[0]));
  const have = new Set(notes.map(n => n.person + '|' + n.org));
  (o.extra||[]).forEach(x => { const person = shortName(x[0]), org = noBrackets(x[1]); const k = person + '|' + org;
    if (!have.has(k)){ have.add(k); notes.push({person, org, yrs: years(x[2]), contact: x[3]||''}); } });
  return {groups:arr, notes};
}

/* ---------- render ---------- */
function render(){
  const out = document.getElementById('out');
  const o = state.org;
  if (!o){ out.innerHTML = '<div class="empty">Pick an organization to get started.</div>'; return; }
  const A = analyze(o), groups = A.groups;
  const shown = state.all ? groups : groups.slice(0, TOP);
  let h = '<div class="result"><div class="rh"><h2>' + esc(o.name) + '</h2><button class="xbtn" id="xclose" aria-label="Close">&times;</button></div>';
  const weak = !groups.length;
  h += '<div class="list">';
  shown.forEach(g => {
    const L = lines(g);
    h += '<div class="card ' + L.cls + '"><div class="avatar">' + esc(initials(g.contact[0])) + '</div>' +
      '<div class="body"><div class="who">' + esc(shortName(g.contact[0])) + '</div><div class="role">' + esc(shortRole(g.contact)) + '</div>' +
      '<ul class="ln">' + L.items.map(x => '<li class="' + x.cls + '">' + x.html + '</li>').join('') + '</ul></div></div>';
  });
  h += '</div>';
  if (groups.length > TOP) h += '<button class="more" id="more">' + (state.all ? 'Show fewer' : 'Show all ' + groups.length) + '</button>';
  if (A.notes.length){
    const roleOf = nm => { const c = (o.C||[]).find(x => shortName(x[0])===shortName(nm)); return c ? shortRole(c) : ''; };
    const line = n => {
      const yrs = n.yrs ? ' (' + n.yrs + ')' : '';
      if (n.contact){ const r = roleOf(n.contact);
        return '<div><b>' + esc(shortName(n.contact)) + '</b>' + (r ? ', ' + esc(r) + ',' : '') + ' and <b>' + esc(n.person) + '</b> both used to work at <b>' + esc(noBrackets(n.org)) + '</b>' + yrs + '.</div>'; }
      return '<div><b>' + esc(n.person) + '</b> used to work at <b>' + esc(noBrackets(n.org)) + '</b>' + yrs + ', as did several contacts here.</div>';
    };
    h += '<div class="note"><b>' + (weak ? 'Shared past employer' : 'Also worth knowing') + '</b>' + A.notes.slice(0,8).map(line).join('') + '</div>';
  }
  h += '</div>';
  out.innerHTML = h;
  document.getElementById('xclose').onclick = clearOrg;
  const more = document.getElementById('more'); if (more) more.onclick = () => { state.all = !state.all; render(); };
}

/* ---------- search ---------- */
const q = document.getElementById('q'), sugg = document.getElementById('sugg');
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function match(term){ const t = norm(term); if(!t) return []; return ORGS.filter(o => norm(o.name).includes(t)).sort((a,b)=>{ const pa=sortKey(a).startsWith(t)?0:1, pb=sortKey(b).startsWith(t)?0:1; return pa-pb||sortKey(a).localeCompare(sortKey(b)); }); }
let hi=-1;
function clearOrg(){ state.org = null; state.all = false; q.value = ''; sugg.style.display = 'none'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function choose(o){ state.org = o; state.all = false; q.value = o.name; sugg.style.display = 'none'; render(); }
function showSugg(){
  const m = match(q.value);
  if (!m.length){ sugg.style.display = 'none'; return; }
  hi=-1; sugg.innerHTML = m.slice(0,8).map((o,i)=>'<button role="option" data-i="'+i+'">'+esc(noBrackets(o.name))+'<small>'+esc(o.cat||'')+'</small></button>').join('');
  sugg.style.display = 'block';
  sugg.querySelectorAll('button').forEach((b,i)=> b.onclick = () => choose(m[i]));
}
q.addEventListener('input', showSugg);
document.addEventListener('keydown', e => { if (e.key==='Escape' && state.org) clearOrg(); });
q.addEventListener('keydown', e => { const m = match(q.value).slice(0,8);
  if (e.key==='ArrowDown'||e.key==='ArrowUp'){ if(!m.length) return; e.preventDefault(); hi = (hi + (e.key==='ArrowDown'?1:-1) + m.length) % m.length; sugg.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===hi)); }
  else if (e.key === 'Enter'){ if (m.length) choose(m[hi>=0?hi:0]); } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) sugg.style.display = 'none'; });
const CATS = [...new Set(ORGS.map(o=>o.cat||'Other'))].sort((a,b)=>a==='Trade Associations'?1:b==='Trade Associations'?-1:a.localeCompare(b));
ORGS.forEach(o => { o._n = analyze(o).groups.length; });
let tab = null;
const sortKey = o => norm(noBrackets(o.name).replace(/^the\s+/i,''));
function browse(){
  const cnt = c => ORGS.filter(o => c==='All' || (o.cat||'Other')===c).length;
  document.getElementById('tabs').innerHTML = ['All',...CATS].map(c => '<button class="tab'+(c===tab?' on':'')+'" data-c="'+esc(c)+'" aria-pressed="'+(c===tab)+'">'+esc(c)+'<small>'+cnt(c)+'</small></button>').join('');
  const rowsEl = document.getElementById('rows');
  if (!tab){ rowsEl.innerHTML = ''; }
  else {
    const full = ORGS.filter(o => tab==='All' || (o.cat||'Other')===tab).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
    rowsEl.innerHTML = full.map(o => '<button class="row'+(o._n?'':' weak')+'" data-i="'+ORGS.indexOf(o)+'"><span>'+esc(noBrackets(o.name))+'</span><span class="n">'+(o._n?'':'Shared past employer ')+'&rsaquo;</span></button>').join('');
  }
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => { tab = (tab===b.dataset.c) ? null : b.dataset.c; browse(); });
  document.querySelectorAll('#rows .row').forEach(b => b.onclick = () => { choose(ORGS[+b.dataset.i]); document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'}); });
}
browse();
render();
</script>
</body>
